name: Build

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the backend parses
        run: python -m compileall -q main.py

      - name: Check versions agree
        run: |
          plugin=$(python -c "import json;print(json.load(open('plugin.json'))['version'])")
          pkg=$(python -c "import json;print(json.load(open('package.json'))['version'])")
          echo "plugin.json=$plugin package.json=$pkg"
          if [ "$plugin" != "$pkg" ]; then
            echo "::error::version mismatch between plugin.json and package.json"
            exit 1
          fi
          # A tag build must match the manifest it ships.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$plugin" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match plugin.json version $plugin"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: LeGoTDP
          path: LeGoTDP-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LeGoTDP

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" LeGoTDP-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
